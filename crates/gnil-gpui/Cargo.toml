[package]
name = "gnil-gpui"
version = "0.2.2"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>", "gnil-fm contributors"]
description = "The Linux/Wayland GPUI runtime maintained for gnil-fm"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"
readme = "README.md"
build = "build.rs"

[features]
default = ["wayland"]
test-support = [
    "backtrace",
    "collections/test-support",
    "rand",
    "util/test-support",
    "wayland",
]
wayland = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "calloop-wayland-source",
    "cosmic-text",
    "filedescriptor",
    "font-kit",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "xkbcommon",
]

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
blade-graphics = { version = "0.7.0", optional = true }
blade-macros = { version = "0.3.0", optional = true }
blade-util = { version = "0.3.0", optional = true }
bytemuck = { version = "1", optional = true }
calloop = "0.13.0"
calloop-wayland-source = { version = "0.3.0", optional = true }
collections = { package = "gpui_collections", version = "0.2.2" }
cosmic-text = { version = "0.14.0", optional = true }
ctor = "0.4.0"
derive_more = "0.99.17"
etagere = "0.2"
filedescriptor = { version = "0.8.2", optional = true }
flume = "0.11"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", features = ["source-fontconfig-dlopen"], optional = true }
futures = "0.3"
gpui_macros = { package = "gpui-macros", version = "0.2.2" }
image = { version = "0.25.1", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
pin-project = "1.1.10"
postage = { version = "0.5", features = ["futures-traits"] }
profiling = "1"
rand = { version = "0.9", optional = true }
raw-window-handle = "0.6"
refineable = { package = "gpui_refineable", version = "0.2.2" }
resvg = { version = "0.45.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union"] }
smol = "2.0"
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { package = "gpui_sum_tree", version = "0.2.2" }
taffy = "=0.9.0"
thiserror = "2.0.12"
usvg = { version = "0.45.0", default-features = false }
util = { package = "gpui_util", version = "0.2.2" }
util_macros = { package = "gpui_util_macros", version = "0.2.2" }
url = "2.5.4"
waker-fn = "1.2.0"
wayland-backend = { version = "0.3.3", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31.2", optional = true }
wayland-cursor = { version = "0.31.1", optional = true }
wayland-protocols = { version = "0.31.2", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-plasma = { version = "0.2.0", features = ["client"], optional = true }
xkbcommon = { version = "0.8.0", features = ["wayland"], optional = true }

[build-dependencies]
naga = { version = "25.0", features = ["wgsl-in"] }

[dev-dependencies]
backtrace = "0.3"
collections = { package = "gpui_collections", version = "0.2.2", features = ["test-support"] }
env_logger = "0.11"
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
rand = "0.9"
unicode-segmentation = "1.10"
util = { package = "gpui_util", version = "0.2.2", features = ["test-support"] }

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
